<meta name="description" content="Controle financeiro pessoal com visual de app de iPhone: saldo disponível, cartões, contas, metas, orçamentos e assistente inteligente. Seus dados ficam no seu aparelho.">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<script>
  // aplica o tema antes de pintar para evitar flash
  try { var t = localStorage.getItem('meumes-theme') || 'auto';
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; } catch (e) {}
</script>

</div>
<div id="shell">
  <div id="page">
    <div id="scroller"><div id="view"></div></div>
    <header class="navbar" id="navbar"><div class="nl" id="navL"></div><div class="nt" id="navT"></div><div class="nr" id="navR"></div></header>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
</div>
<script src="/js/core.js"></script>
<script src="/js/smart.js"></script>
<script src="/js/ui.js"></script>
